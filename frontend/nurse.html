<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>e-Humure — nurse</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="card">
    <div class="lang-switch">
      <button id="lang-en" type="button">English</button>
      <button id="lang-rw" type="button">Kinyarwanda</button>
    </div>
    <h1>e-Humure</h1>
    <p class="note" id="welcome"></p>
        <label for="patient-code">Patient code (no names)</label>
    <input id="patient-code" placeholder="Filled in automatically" readonly>
    
    <h2>New patient</h2>
    <input id="reg-age" type="number" placeholder="Age">
    <select id="reg-condition">
      <option value="diabetes">Diabetes</option>
      <option value="hypertension">Hypertension</option>
    </select>
    <input id="reg-sector" placeholder="Sector">
    <input id="reg-phone" placeholder="Phone, e.g. +250780000003">
    <button type="button" id="reg-save">Register patient</button>
    <p class="note" id="reg-message"></p>
    <p class="note"><a href="login.html">Sign out</a></p>
  </div>
  <div id="screen" style="display:none"></div>
  <div class="card">
    <h2>My screenings</h2>
    <div id="screening-list" class="note">Loading...</div>
    <button type="button" id="scr-refresh" class="secondary">Refresh</button>
  </div>
  <script src="../backend/scoring.js"></script>
  <script src="questions.js"></script>
  <script src="js/step-consent.js"></script>
  <script src="js/step-quick.js"></script>
  <script src="js/step-full.js"></script>
  <script src="js/app.js"></script>
  <script>
    // If no token or wrong role, go back to login.
       // If no token or wrong role, go back to login.
    var name = sessionStorage.getItem("ehumure_name");
    var role = sessionStorage.getItem("ehumure_role");
    if (!name || role !== "nurse") window.location.href = "login.html";
    document.getElementById("welcome").textContent = "Signed in as " + name;

    // The screening part stays hidden until there is a patient code.
    function updateScreen() {
      document.getElementById("screen").style.display =
        document.getElementById("patient-code").value.trim() ? "" : "none";
    }

    document.getElementById("reg-save").onclick = function () {
      var msg = document.getElementById("reg-message");
      fetch("http://localhost:4000/patients", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + sessionStorage.getItem("ehumure_token") },
        body: JSON.stringify({
          age: document.getElementById("reg-age").value,
          condition: document.getElementById("reg-condition").value,
          sector: document.getElementById("reg-sector").value,
          phone: document.getElementById("reg-phone").value
        })
      })
        .then(function (res) { return res.json(); })
        .then(function (d) {
          if (d.error) { msg.textContent = d.error; return; }
          document.getElementById("patient-code").value = d.patientId;
          msg.textContent = "Patient code: " + d.patientId;
          updateScreen();
        })
        .catch(function () { msg.textContent = "Cannot reach the backend."; });
    };

    function loadScreenings() {
      var box = document.getElementById("screening-list");
      fetch("http://localhost:4000/screenings", {
        headers: { Authorization: "Bearer " + sessionStorage.getItem("ehumure_token") }
      })
        .then(function (res) { return res.json().then(function (d) { return { ok: res.ok, data: d }; }); })
        .then(function (out) {
          if (!out.ok) { box.textContent = out.data.error; return; }
          if (out.data.length === 0) { box.textContent = "No screenings yet."; return; }
          box.innerHTML = "";
          var total = document.createElement("p");
          total.style.fontWeight = "bold";
          total.textContent = "Total screened: " + out.data.length;
          box.appendChild(total);
          out.data.forEach(function (s) {
            var item = document.createElement("div");
            item.style.border = "1px solid #d8e0e6";
            item.style.borderRadius = "8px";
            item.style.padding = "12px";
            item.style.margin = "10px 0";
            item.style.cursor = "pointer";
            var title = document.createElement("strong");
            title.textContent = "Patient " + s.patient_id;
            var when = document.createElement("div");
            when.textContent = new Date(s.screened_at).toLocaleString();
            var detail = document.createElement("div");
            detail.textContent = s.stage === "quick"
              ? "Quick screen"
              : "Full screen, score " + s.total_score + (s.item9_flag ? " — EMERGENCY" : "");
            item.appendChild(title);
            item.appendChild(when);
            item.appendChild(detail);
            item.onclick = function () {
              document.getElementById("patient-code").value = s.patient_id;
              updateScreen();
              window.scrollTo(0, 0);
            };
            box.appendChild(item);
          });
        })
        .catch(function () { box.textContent = "Cannot reach the backend."; });
    }
    document.getElementById("scr-refresh").onclick = loadScreenings;
    loadScreenings();
  </script>
</body>
</html>
