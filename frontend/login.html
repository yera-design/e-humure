<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>e-Humure staff login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="card">
    <h1>Staff login</h1>
    <p class="note">Three demo accounts: nurse, psychologist, desk staff.</p>

    <div class="question">
      <p><label for="username">Username</label></p>
      <input id="username" type="text" autocomplete="off">
    </div>

    <div class="question">
      <p><label for="password">Password</label></p>
      <input id="password" type="password" autocomplete="off">
    </div>

    <div class="actions">
      <button id="signin">Sign in</button>
      <button id="check" class="secondary">Check my role</button>
    </div>

    <p id="message" class="note"></p>
    <p class="note"><a href="index.html">Back to screening</a></p>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
